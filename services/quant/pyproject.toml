[project]
name = "quant"
version = "0.1.0"
description = "Bot Core, Datenpipeline und Paper Trading der Trading-Intelligence-Plattform (Research/Paper-Modus)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.8",
  "httpx>=0.27",
  "redis>=5.0",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.setuptools.package-data]
quant = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
# Fehlerklassen, die echte Bugs finden; Stilfragen bewusst schlank
select = ["E", "F", "W", "B", "I", "UP", "BLE"]
# B008: FastAPI-Depends und unveraenderliche Dataclass-Defaults sind gewollt; UP042: str-Enum-Verhalten bleibt stabil
ignore = ["E501", "B905", "UP017", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001", "E731", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
