[project]
name = "quant"
version = "0.1.0"
description = "Bot Core, Datenpipeline und Paper Trading der Trading-Intelligence-Plattform (Research/Paper-Modus)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.8",
  "httpx>=0.27",
  "redis>=5.0",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["quant*"]

[tool.setuptools.package-data]
quant = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
